# Copy this file to .github/workflows/backup.yml in the PRIVATE backup repo.
# Never add it to the public Prod-Noodle repo.
name: Weekly shop database backup

on:
  schedule:
    - cron: '17 20 * * 6' # Saturday 20:17 UTC = Sunday 03:17 Bangkok (shop closed)
  workflow_dispatch: {}   # "Run workflow" button for a manual backup

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      verifydb: # empty throwaway database used only to test-restore the backup
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify-only
          POSTGRES_DB: prod_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Back up the shop database
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          file=$(bash ops/backup/backup.sh "backups/$(date -u +%Y)")
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Prove the backup can be restored
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          VERIFY_DB_URL: postgresql://postgres:verify-only@127.0.0.1:5432/prod_verify
        run: |
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          bash ops/backup/verify.sh "${{ steps.backup.outputs.file }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the encrypted backup in this private repo
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          git commit -m "Backup $(basename "${{ steps.backup.outputs.file }}")"
          git push
