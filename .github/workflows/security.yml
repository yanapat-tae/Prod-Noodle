name: Security review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Secrets (history and worktree)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash security/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact=100 --log-opts="--all"'
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact=100'
  sast:
    name: Static security rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.180.0
      - run: semgrep --test --config security/semgrep.yml security/semgrep-tests/semgrep.ts
      - run: semgrep scan --config security/semgrep.yml --metrics off --disable-version-check --error --strict src server supabase/functions scripts preview
  dependencies-and-tests:
    name: Dependencies and security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm check
